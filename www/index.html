<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SolarRoofDesign</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
        #solar-report-panel {
            position: absolute; bottom: 20px; right: 20px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-family: sans-serif;
        }
        button { background: #ff8c00; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="solar-report-panel">
        <h3>Solar System Report</h3>
        <p id="report-panels">Panels Placed: <span id="panel-count">0</span></p>
        <p id="report-capacity">Total Capacity: <span id="capacity-kw">0</span> kWp</p>
        <p id="report-generation">Est. Annual Generation: <span id="annual-gen">0</span> kWh</p>
        <button onclick="exportSolarPDF()">Export PDF Report</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map with high zoom capability (maxZoom 21)
        const map = L.map('map', {
            maxZoom: 21,
            zoomControl: true,
            tap: true
        }).setView([-26.2041, 28.0473], 18);

        // Add High-Resolution Satellite Tiles
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 21,
            maxNativeZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP'
        }).addTo(map);

        let placedPanelsCount = 0;

        // Example click listener to drop/count panels on roof
        map.on('click', function(e) {
            placedPanelsCount++;
            L.marker(e.latlng).addTo(map).bindPopup('Panel #' + placedPanelsCount).openPopup();
            updateReport();
        });

        function updateReport() {
            const capacityKW = (placedPanelsCount * 0.550).toFixed(2);
            const annualGen = (capacityKW * 1650).toFixed(0);
            document.getElementById('panel-count').innerText = placedPanelsCount;
            document.getElementById('capacity-kw').innerText = capacityKW;
            document.getElementById('annual-gen').innerText = annualGen;
        }

        function exportSolarPDF() {
            window.print();
        }
    </script>
</body>
</html>
